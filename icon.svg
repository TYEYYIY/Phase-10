<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TYEYYIY Phase 10">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#214532"/>
      <stop offset="48%" stop-color="#0d1f16"/>
      <stop offset="100%" stop-color="#020604"/>
    </radialGradient>

    <linearGradient id="cardRed" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ff5c6e"/>
      <stop offset="35%" stop-color="#ef3a4d"/>
      <stop offset="80%" stop-color="#c01528"/>
      <stop offset="100%" stop-color="#7a0413"/>
    </linearGradient>

    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset in="blur" dy="14" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.8"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>

  <!-- خلفية -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- توهج ذهبي خلفي -->
  <ellipse cx="256" cy="290" rx="190" ry="200" fill="#f4b942" opacity="0.16" filter="url(#ambientGlow)"/>

  <!-- الكرت الرئيسي -->
  <g transform="translate(256 256) rotate(-9)" filter="url(#cardShadow)">
    <!-- جسم الكرت -->
    <rect x="-150" y="-210" width="300" height="420" rx="24" fill="url(#cardRed)" stroke="#ffffff" stroke-width="6"/>

    <!-- إطار داخلي -->
    <rect x="-138" y="-198" width="276" height="396" rx="16" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2.5"/>

    <!-- انعكاس ضوئي -->
    <rect x="-150" y="-210" width="300" height="140" rx="24" fill="url(#gloss)"/>

    <!-- البيضة البيضاء -->
    <ellipse cx="0" cy="-5" rx="108" ry="145" fill="#ffffff"/>
    <ellipse cx="0" cy="-5" rx="108" ry="145" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="3"/>

    <!-- الرقم 10 الكبير -->
    <text x="0" y="52" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-size="170" font-weight="900" font-style="italic" fill="#8e0c1c" text-anchor="middle" letter-spacing="-10">10</text>

    <!-- 10 صغيرة في الزوايا -->
    <text x="-108" y="-158" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">10</text>
    <text x="108" y="180" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">10</text>
  </g>
</svg>