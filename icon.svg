<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- تدرج الخلفية الداكنة -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#153022"/>
      <stop offset="1" stop-color="#040a07"/>
    </radialGradient>
    
    <!-- تدرج البطاقة الذهبية -->
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b2"/>
      <stop offset="0.5" stop-color="#ffd75e"/>
      <stop offset="1" stop-color="#c98a05"/>
    </linearGradient>
    
    <!-- تدرج اللمعة الزجاجية العلوية -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    
    <!-- تدرج لون الرقم 10 -->
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#382a00"/>
      <stop offset="1" stop-color="#120c00"/>
    </linearGradient>
    
    <!-- ظل البطاقة الخارجي -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <!-- ظل داخلي للكرات الملونة -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="5"/>
      <feGaussianBlur stdDeviation="5" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.5"/>
      <feComposite operator="in" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>
  
  <!-- الخلفية الدائرية للتطبيق -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- ظل البطاقة -->
  <rect x="106" y="80" width="300" height="368" rx="36" fill="#000000" opacity="0.5" filter="url(#shadow)"/>
  
  <!-- جسم البطاقة -->
  <rect x="106" y="72" width="300" height="368" rx="36" fill="url(#card)" stroke="#7a4d00" stroke-width="10"/>
  
  <!-- الإطار الأبيض الداخلي -->
  <rect x="116" y="82" width="280" height="348" rx="26" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  
  <!-- اللمعة العلوية (تأثير الزجاج) -->
  <rect x="106" y="72" width="300" height="160" rx="36" fill="url(#shine)"/>
  
  <!-- الرقم 10 -->
  <text x="256" y="340" font-size="230" text-anchor="middle" fill="url(#num)" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-style="italic" letter-spacing="-12" filter="drop-shadow(0px 5px 2px rgba(255,255,255,0.4))">10</text>
  
  <!-- النقطة الحمراء (أعلى اليسار) -->
  <circle cx="148" cy="114" r="22" fill="#e63946" filter="url(#innerShadow)"/>
  <circle cx="143" cy="109" r="6" fill="#ff8b95" opacity="0.7"/> <!-- لمعة النقطة -->
  
  <!-- النقطة الزرقاء (أسفل اليمين) -->
  <circle cx="364" cy="398" r="22" fill="#2e8bff" filter="url(#innerShadow)"/>
  <circle cx="359" cy="393" r="6" fill="#7dbcff" opacity="0.7"/> <!-- لمعة النقطة -->
</svg>