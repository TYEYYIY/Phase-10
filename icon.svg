<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TYEYYIY Phase 10">
  <defs>
    <!-- خلفية اللعبة -->
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#183526"/>
      <stop offset="60%" stop-color="#0a1811"/>
      <stop offset="100%" stop-color="#020604"/>
    </radialGradient>

    <!-- تدرج الكرت الأحمر -->
    <linearGradient id="cardRed" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ff5c6e"/>
      <stop offset="35%" stop-color="#ef3a4d"/>
      <stop offset="80%" stop-color="#c01528"/>
      <stop offset="100%" stop-color="#7a0413"/>
    </linearGradient>

    <!-- تدرج الكرت الأسود (Wild) -->
    <linearGradient id="cardWild" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- تدرج الذهبي لكرت Wild -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffeb80"/>
      <stop offset="100%" stop-color="#c98a05"/>
    </linearGradient>

    <!-- انعكاس ضوئي -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- ظل الكروت -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- خلفية الأيقونة -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- مجموعة الكروت (مصغرة وممركزة لضمان عدم القص) -->
  <g transform="translate(256, 256) scale(0.88) translate(-256, -256)">
    
    <!-- 1. كرت Wild (في الخلف) -->
    <!-- تم رفعه لليمين أكثر وإبراز الإطار الذهبي -->
    <g transform="translate(340, 170) rotate(20)" filter="url(#shadow)">
      <rect x="-85" y="-120" width="170" height="240" rx="14" fill="url(#cardWild)" stroke="#f4b942" stroke-width="5"/>
      <rect x="-77" y="-112" width="154" height="224" rx="9" fill="none" stroke="rgba(244,185,66,0.4)" stroke-width="2"/>
      <circle cx="0" cy="0" r="50" fill="url(#gold)"/>
      <text x="0" y="20" font-family="'Arial Black', Arial, sans-serif" font-size="65" font-weight="900" font-style="italic" fill="#050505" text-anchor="middle">W</text>
      <rect x="-85" y="-120" width="170" height="75" rx="14" fill="url(#gloss)"/>
    </g>

    <!-- 2. كرت 10 (في المقدمة) -->
    <!-- تم توسيطه وتصغيره قليلاً لإبعاده عن الحواف -->
    <g transform="translate(240, 260) rotate(-6)" filter="url(#shadow)">
      <rect x="-140" y="-195" width="280" height="390" rx="20" fill="url(#cardRed)" stroke="#ffffff" stroke-width="5"/>
      <rect x="-128" y="-183" width="256" height="366" rx="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2.5"/>
      
      <ellipse cx="0" cy="-5" rx="98" ry="130" fill="#ffffff"/>
      
      <!-- الرقم 10 الكبير -->
      <text x="0" y="50" font-family="'Arial Black', Arial, sans-serif" font-size="155" font-weight="900" font-style="italic" fill="#8e0c1c" text-anchor="middle" letter-spacing="-8">10</text>
      
      <!-- 10 صغيرة في الزوايا -->
      <text x="-100" y="-145" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">10</text>
      <text x="100" y="165" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">10</text>
      
      <rect x="-140" y="-195" width="280" height="120" rx="20" fill="url(#gloss)"/>
    </g>

  </g>
</svg>